name: streampulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create .env from example
        run: cp .env.example .env

      - name: Start Redpanda
        run: docker compose up -d

      - name: Wait for Redpanda to accept connections
        run: |
          echo "Waiting for port 9092..."
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1; then
              echo "Port 9092 is open after ${i} attempts."
              exit 0
            fi
            echo "Attempt ${i}/30: not ready yet, waiting 2s..."
            sleep 2
          done
          echo "Redpanda never became reachable. Dumping diagnostics:"
          docker compose ps
          docker compose logs redpanda --tail 100
          exit 1

      - name: Dump Redpanda status before producing
        if: always()
        run: |
          docker compose ps
          docker compose logs redpanda --tail 100

      - name: Produce sample orders
        run: python -m producer.produce_orders --max-events 50

      - name: Consume orders into DuckDB
        run: python -m consumer.consume_orders --max-events 50

      - name: Run dbt models
        run: dbt run --profiles-dir .
        working-directory: dbt

      - name: Run dbt tests
        run: dbt test --profiles-dir .
        working-directory: dbt

      - name: Run pytest suite
        run: pytest tests/

      - name: Tear down containers
        if: always()
        run: docker compose down
