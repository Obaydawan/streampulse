<svg width="680" height="720" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" role="img">
<title>StreamPulse architecture diagram</title>
<desc>Data flows from a producer through Redpanda to a consumer, which splits valid events into a bronze layer and invalid events into a rejected events store. dbt transforms bronze data into silver_orders and alerts tables, which feed a Streamlit app split into a Dashboard tab and an AI Query Agent tab.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="720" fill="#ffffff"/>

<line x1="200" y1="68" x2="260" y2="68" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="420" y1="68" x2="480" y2="68" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="560" y1="96" x2="215" y2="150" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="560" y1="96" x2="505" y2="150" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="210" y1="212" x2="290" y2="266" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="500" y1="212" x2="390" y2="266" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="328" x2="215" y2="382" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="328" x2="505" y2="382" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="210" y1="444" x2="300" y2="498" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="510" y1="444" x2="380" y2="498" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="560" x2="210" y2="614" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="560" x2="500" y2="614" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Producer -->
<rect x="40" y="40" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="120" y="58" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Producer</text>
<text x="120" y="76" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Generates events</text>

<!-- Redpanda -->
<rect x="260" y="40" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Redpanda</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">48h retention</text>

<!-- Consumer -->
<rect x="480" y="40" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="560" y="58" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Consumer</text>
<text x="560" y="76" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Validates events</text>

<!-- Bronze layer -->
<rect x="90" y="156" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="210" y="174" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">Bronze layer</text>
<text x="210" y="192" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#085041">Valid orders (DuckDB)</text>

<!-- Rejected events -->
<rect x="380" y="156" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="500" y="174" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Rejected events</text>
<text x="500" y="192" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#712B13">DLQ + rejected_events</text>

<!-- dbt -->
<rect x="230" y="272" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="290" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">dbt</text>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#085041">Transforms &amp; tests models</text>

<!-- silver_orders -->
<rect x="90" y="388" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="210" y="406" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">silver_orders</text>
<text x="210" y="424" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#085041">Order totals, cleaned</text>

<!-- alerts -->
<rect x="400" y="388" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="510" y="406" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">alerts</text>
<text x="510" y="424" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#085041">Anomaly &amp; quality signals</text>

<!-- Streamlit -->
<rect x="240" y="504" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="522" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Streamlit</text>
<text x="340" y="540" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Live dashboard app</text>

<!-- Dashboard -->
<rect x="90" y="620" width="230" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="205" y="638" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Dashboard</text>
<text x="205" y="656" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Metrics, alerts, orders</text>

<!-- AI query agent -->
<rect x="370" y="620" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="500" y="638" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C">AI query agent</text>
<text x="500" y="656" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3C3489">Gemini, guardrails, results</text>
</svg>
